# Manual teardown of one environment. Runs in the matching GitHub Environment (so prod
# teardown needs reviewer approval) and requires typing the environment name to confirm.
# Azure login is OIDC only. See docs/deployment.md.
name: teardown
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to destroy"
        type: choice
        options: [dev, prod]
        default: dev
      deploy_tool:
        description: "Tool that created it"
        type: choice
        options: [terraform, bicep]
        default: terraform
      confirm:
        description: "Type the environment name again to confirm"
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: aap-azure
  cancel-in-progress: false
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Only main may destroy an environment
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Teardown runs only from the main branch."
            exit 1
          fi
  teardown:
    needs: guard
    if: inputs.confirm == inputs.environment && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      TARGET_ENV: ${{ inputs.environment }}
      DEPLOY_TOOL: ${{ inputs.deploy_tool }}
      LOCATION: ${{ vars.AZURE_LOCATION || 'eastus2' }}
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
      TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with: { terraform_version: "1.16.4", terraform_wrapper: false }
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Destroy
        run: .github/scripts/deploy.sh destroy
