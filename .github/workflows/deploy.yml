# Manual deploy with azd using GitHub OIDC (workload identity federation) — no stored secrets.
# DISABLED BY DEFAULT: the job only runs when the repository variable ENABLE_DEPLOY == 'true'.
#
# One-time setup (see docs/deploy.md):
#   1. Create an Entra app registration / user-assigned MI with a federated credential for
#      repo:jagadishmazure-jpg/azure-agent-platform:environment:dev
#   2. Grant it Contributor + Role Based Access Control Administrator (conditioned to the roles in
#      infra/modules/roles.bicep) on the target subscription or resource group.
#   3. Repository variables: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, ENABLE_DEPLOY=true
name: deploy
on:
  workflow_dispatch:
    inputs:
      environment: { description: "azd environment name", required: true, default: "aap-dev" }
      location: { description: "Azure region", required: true, default: "eastus2" }
      teardown: { description: "Run azd down --purge instead of up", type: boolean, default: false }
permissions:
  id-token: write
  contents: read
jobs:
  deploy:
    if: ${{ vars.ENABLE_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    environment: dev
    env:
      AZURE_ENV_NAME: ${{ inputs.environment }}
      AZURE_LOCATION: ${{ inputs.location }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_PRINCIPAL_TYPE: ServicePrincipal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: Azure/setup-azd@v2
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: azd login (federated)
        run: azd auth login --client-id "$AZURE_CLIENT_ID" --federated-credential-provider github --tenant-id "$AZURE_TENANT_ID"
      - name: Select environment
        run: |
          azd env new "$AZURE_ENV_NAME" --location "$AZURE_LOCATION" --subscription "$AZURE_SUBSCRIPTION_ID" --no-prompt || azd env select "$AZURE_ENV_NAME"
          azd env set AZURE_PRINCIPAL_ID "$(az ad sp show --id "$AZURE_CLIENT_ID" --query id -o tsv)"
      - name: Provision + deploy
        if: ${{ !inputs.teardown }}
        run: azd up --no-prompt
      - name: Teardown
        if: ${{ inputs.teardown }}
        run: azd down --purge --force --no-prompt
