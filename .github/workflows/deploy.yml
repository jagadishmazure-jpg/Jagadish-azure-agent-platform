# Deploy: build images -> dev -> (approval) -> prod, with either Bicep or Terraform.
#
# MANUAL ONLY. This workflow does not run on push. Start it from the Actions tab
# (workflow_dispatch) and set confirm to deploy. GitHub Environments `dev` and `prod`
# are the approval gates: add required reviewers on both before the first run.
# Azure login is OIDC only (azure/login with a federated credential): no client secret exists.
# See docs/deployment.md.
name: deploy
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type deploy to confirm"
        type: string
        required: true
      deploy_tool:
        description: "IaC tool"
        type: choice
        options: [terraform, bicep]
        default: terraform
      promote_to_prod:
        description: "Continue to prod after dev (prod still waits for reviewer approval)"
        type: boolean
        default: true
      location:
        description: "Azure region"
        type: string
        default: eastus2
permissions:
  contents: read
concurrency:
  group: aap-azure
  cancel-in-progress: false
env:
  DEPLOY_TOOL: ${{ inputs.deploy_tool || vars.DEPLOY_TOOL || 'terraform' }}
  LOCATION: ${{ inputs.location || vars.AZURE_LOCATION || 'eastus2' }}
  IMAGE_TAG: ${{ github.sha }}
  TF_VERSION: "1.16.4"
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Require confirmation and OIDC variables
        env:
          CONFIRM: ${{ inputs.confirm }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          {
            echo "### Deploy gate"
            echo "- trigger: manual workflow_dispatch (no push)"
            echo "- confirm: \`${CONFIRM}\`"
            echo "- deploy tool: \`${DEPLOY_TOOL}\`, region: \`${LOCATION}\`, image tag: \`${IMAGE_TAG}\`"
            echo "- OIDC client id set: \`${{ vars.AZURE_CLIENT_ID != '' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$CONFIRM" != "deploy" ]; then
            echo "::error::Refusing to deploy. Re-run the workflow and set confirm to deploy."
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Deploy runs only from the main branch, so an unreviewed ref cannot use the Azure OIDC identity."
            exit 1
          fi

  build:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build images
        run: |
          mkdir -p images
          for img in bff a2a mcp; do
            docker build -f services/$img/Dockerfile -t aap-$img:$IMAGE_TAG .
            docker save aap-$img:$IMAGE_TAG -o images/aap-$img.tar
          done
      - name: Local smoke (bff /healthz)
        run: |
          docker run -d --name bff -p 8080:8080 aap-bff:$IMAGE_TAG
          for i in $(seq 1 20); do curl -fsS localhost:8080/healthz && exit 0; sleep 2; done
          docker logs bff; exit 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: images, path: images, retention-days: 3 }

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      TARGET_ENV: dev
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
      TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
    outputs:
      acr_name: ${{ steps.provision.outputs.acr_name }}
      app_url: ${{ steps.provision.outputs.app_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Require OIDC variables from this environment
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          missing=0
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Set Actions variable $name on the dev environment (not a secret)."
              missing=1
            fi
          done
          exit "$missing"
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with: { terraform_version: "${{ env.TF_VERSION }}", terraform_wrapper: false }
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Provision (${{ env.DEPLOY_TOOL }})
        id: provision
        run: .github/scripts/deploy.sh provision
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: images, path: images }
      - name: Push images to ACR
        env: { ACR_NAME: "${{ steps.provision.outputs.acr_name }}" }
        run: .github/scripts/deploy.sh push
      - name: Roll Container Apps
        env:
          ACR_NAME: ${{ steps.provision.outputs.acr_name }}
          RESOURCE_GROUP: ${{ steps.provision.outputs.resource_group }}
        run: .github/scripts/deploy.sh roll
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - name: Seed Search indexes and register Foundry agents
        run: .github/scripts/deploy.sh seed
      - name: Smoke tests
        env: { APP_URL: "${{ steps.provision.outputs.app_url }}" }
        run: .github/scripts/deploy.sh smoke

  deploy-prod:
    needs: deploy-dev
    if: inputs.promote_to_prod
    runs-on: ubuntu-latest
    environment: prod # required reviewers are configured on this environment
    permissions:
      contents: read
      id-token: write
    env:
      TARGET_ENV: prod
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
      TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Require OIDC variables from this environment
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          missing=0
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Set Actions variable $name on the prod environment (not a secret)."
              missing=1
            fi
          done
          exit "$missing"
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with: { terraform_version: "${{ env.TF_VERSION }}", terraform_wrapper: false }
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Provision (${{ env.DEPLOY_TOOL }})
        id: provision
        run: .github/scripts/deploy.sh provision
      - name: Promote images from dev ACR (same digest, no rebuild)
        env:
          ACR_NAME: ${{ steps.provision.outputs.acr_name }}
          SOURCE_ACR: ${{ needs.deploy-dev.outputs.acr_name }}
        run: .github/scripts/deploy.sh import
      - name: Roll Container Apps
        env:
          ACR_NAME: ${{ steps.provision.outputs.acr_name }}
          RESOURCE_GROUP: ${{ steps.provision.outputs.resource_group }}
        run: .github/scripts/deploy.sh roll
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - name: Seed Search indexes and register Foundry agents
        run: .github/scripts/deploy.sh seed
      - name: Smoke tests
        env: { APP_URL: "${{ steps.provision.outputs.app_url }}" }
        run: .github/scripts/deploy.sh smoke
