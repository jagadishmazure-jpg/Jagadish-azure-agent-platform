name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tests (offline, mocks)
        run: pytest -q
      - name: Agent cards are current
        run: python scripts/export_agent_cards.py --check
      - name: Generated failure table is current
        run: python scripts/render_docs.py --check
      - name: Doc drift (pasted output and code excerpts match the code)
        run: python scripts/doc_drift.py --check
      - name: Eval release gate (golden sets)
        run: python scripts/run_evals.py --out evals-out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with: { name: eval-rows, path: evals-out }
  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Bicep CLI
        run: |
          curl -sSLo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x bicep && sudo mv bicep /usr/local/bin/bicep && bicep --version
      - name: Build (lint rules run as part of build)
        run: bicep build infra/main.bicep --stdout > /dev/null

  sbom:
    # Software bill of materials for the source tree (lockfiles and manifests), kept as a build
    # artifact on every run. Image SBOMs, where the repo ships a container, come from the image job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Software bill of materials (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          artifact-name: sbom.spdx.json
          upload-release-assets: false

  secrets:
    # gitleaks over the full git history. Known false positives (public role IDs, synthetic
    # attack fixtures) are listed by fingerprint in .gitleaksignore.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: gitleaks (full history)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
