[project]
name = "azure-agent-platform"
version = "0.1.0"
description = "Azure-native agentic AI platform showcase: mortgage origination multi-agent system on Microsoft Agent Framework + Foundry, A2A control plane, MCP tools, azd-deployable infra."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jagadish Meduri" }]
requires-python = ">=3.11"
# Versions below were resolved and installed on 2026-09-25 (see docs/sdk-notes.md).
dependencies = [
  "agent-framework-core==1.19.0",
  "agent-framework-foundry==1.13.1",
  "agent-framework-azure-cosmos==1.0.0b260918",
  "azure-ai-projects==2.6.1",            # agent-framework-foundry 1.13.1 requires <2.7
  "azure-search-documents==12.0.0",
  "azure-ai-documentintelligence==1.0.2",
  "azure-ai-contentsafety==1.0.0",
  "azure-identity==1.25.3",
  "azure-cosmos==4.17.1",
  "azure-servicebus==7.14.3",
  "azure-monitor-opentelemetry==1.8.10",
  "a2a-sdk[fastapi]==1.1.5",
  "mcp==2.2.0",
  "fastapi==0.141.1",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "pydantic>=2.13,<3",
]

[project.optional-dependencies]
eval = ["azure-ai-evaluation==1.18.7"]
dev = ["azure-ai-evaluation==1.18.7", "pyyaml>=6", "pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentplatform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src", "."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008", "E501"]
