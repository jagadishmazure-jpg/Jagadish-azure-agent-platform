[project]
name = "azure-agent-platform"
version = "0.1.0"
description = "Azure-native agentic AI platform showcase: mortgage origination multi-agent system on Microsoft Agent Framework + Foundry, A2A control plane, MCP tools, azd-deployable infra."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jagadish Meduri" }]
requires-python = ">=3.11"
# Versions below were resolved and installed together (see docs/sdk-notes.md).
dependencies = [
  "agent-framework-core==1.23.0",
  "agent-framework-foundry==1.15.0",
  "agent-framework-orchestrations==1.4.0",  # prebuilt Sequential/Concurrent/Handoff/GroupChat/Magentic
  "agent-framework-azure-cosmos==1.0.0b261015",
  "azure-ai-projects==2.9.0",            # agent-framework-foundry 1.13.1 requires <2.7
  "azure-search-documents==12.0.0",
  "azure-ai-documentintelligence==1.0.2",
  "azure-ai-contentsafety==1.0.0",
  "azure-identity==1.27.0",
  "azure-cosmos==4.17.1",
  "azure-servicebus==7.15.0",
  "azure-monitor-opentelemetry==1.8.11",
  "a2a-sdk[fastapi]==1.2.3",
  "mcp==2.3.0",
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "pydantic>=2.13,<3",
]

[project.optional-dependencies]
eval = ["azure-ai-evaluation==1.18.10"]
dev = ["azure-ai-evaluation==1.18.10", "pyyaml>=6", "pytest==9.1.1", "pytest-asyncio==1.4.1", "ruff==0.17.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentplatform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src", "."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests", "scripts"]
# Markdown holds generated code excerpts (scripts/doc_drift.py); keep them byte-for-byte.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008", "E501"]
